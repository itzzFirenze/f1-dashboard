# ============================================
# F1 Dashboard - Default Profile (H2 Embedded)
# ============================================
spring:
  application:
    name: f1-dashboard
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  mvc:
    pathmatch:
      matching-strategy: path_pattern_parser

  # H2 embedded database (desktop & cloud mode)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:${DB_FILE_PATH:/tmp/f1-data};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Virtual threads (Java 21)
  threads:
    virtual:
      enabled: true

  # Email / SMTP configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Resend HTTP Email API (bypasses Render SMTP port blocking)
resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Server configuration (Render dynamic PORT support)
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI (disabled in production, enabled in dev profile)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Circuits source file configuration (dev utility)
circuits:
  index:
    path: ${CIRCUITS_INDEX_PATH:../frontend/src/data/circuits/index.ts}

# App-specific configuration
app:
  api:
    jolpica-base-url: https://api.jolpi.ca/ergast/f1
    jolpica-alpha-url: https://api.jolpi.ca/f1/alpha
    openf1-base-url: https://api.openf1.org/v1
    sync-interval-hours: 6
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging:
  level:
    com.f1dashboard: INFO
    org.springframework.security: WARN
