services:
  - type: web
    name: f1-dashboard-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,https://f1-dashboard-six-sage.vercel.app,https://*.vercel.app"
